name: Update profile card

on:
  schedule:
    - cron: "0 7 * * *" # daily (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: profile-card-cache-${{ github.repository_owner }}
          restore-keys: |
            profile-card-cache-

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats_dark.svg assets/stats_light.svg
          git commit -m "chore(readme): update profile stats card" || exit 0
          git push
